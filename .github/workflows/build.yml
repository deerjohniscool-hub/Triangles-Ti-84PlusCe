name: Build TI-84 Plus CE
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CE toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ce-toolchain"
          gh release download --repo CE-Programming/toolchain --pattern 'CEdev-Linux*.tar.gz' --dir "$RUNNER_TEMP/ce-toolchain"
          archive=$(find "$RUNNER_TEMP/ce-toolchain" -name '*.tar.gz' -print -quit)
          tar -xzf "$archive" -C "$RUNNER_TEMP/ce-toolchain"
          config=$(find "$RUNNER_TEMP/ce-toolchain" -type f -name cedev-config -print -quit)
          test -n "$config"
          echo "$(dirname "$config")" >> "$GITHUB_PATH"
      - name: Compile
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: TRISOLVE-calculator-program
          path: bin/*.8xp
          if-no-files-found: error
